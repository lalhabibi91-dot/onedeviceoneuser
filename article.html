<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f8038">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cash Mode">
    <link rel="manifest" href="/site.webmanifest?v=4">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <title>Minimal Article Reader</title>
    <!-- Tailwind CSS for modern, smooth styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Smooth transitions for a polished feel */
        body {
            transition: background-color 0.3s ease, color 0.3s ease;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header Section -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight text-indigo-600 flex items-center gap-2">
                <span>📖</span> DevReads
            </h1>
            <button id="themeToggle" class="text-sm bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-full transition font-medium">
                🌙 Dark Mode
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full">
        
        <!-- View 1: Article List (Default) -->
        <section id="listView">
            <div class="mb-6">
                <h2 class="text-2xl font-extrabold text-slate-900">Latest Articles</h2>
                <p class="text-slate-500 text-sm mt-1">Fetched live from a public API, clean and easy to read.</p>
            </div>

            <!-- Loading Spinner State -->
            <div id="loading" class="flex justify-center items-center py-20">
                <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600"></div>
            </div>

            <!-- Article Grid Container -->
            <div id="articleContainer" class="grid gap-6 md:grid-cols-2 hidden">
                <!-- JavaScript will inject cards here -->
            </div>
        </section>

        <!-- View 2: Single Article Reader View (Hidden by default) -->
        <section id="readerView" class="hidden">
            <button id="backBtn" class="mb-6 inline-flex items-center text-sm font-semibold text-indigo-600 hover:text-indigo-800 transition">
                &larr; Back to all articles
            </button>
            <article class="bg-white p-6 sm:p-10 rounded-2xl shadow-sm border border-slate-200">
                <span class="text-xs uppercase tracking-wider font-bold text-indigo-500 bg-indigo-50 px-2.5 py-1 rounded-md">Article #<span id="readId"></span></span>
                <h2 id="readTitle" class="text-2xl sm:text-3xl font-extrabold text-slate-900 mt-4 leading-snug"></h2>
                <div class="h-px bg-slate-100 my-6"></div>
                <p id="readBody" class="text-slate-600 text-lg leading-relaxed whitespace-pre-line"></p>
            </article>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-sm text-slate-400">
        <p>Built with HTML, Tailwind CSS, and Vanilla JavaScript.</p>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // DOM Elements
        const listView = document.getElementById('listView');
        const readerView = document.getElementById('readerView');
        const articleContainer = document.getElementById('articleContainer');
        const loading = document.getElementById('loading');
        const backBtn = document.getElementById('backBtn');
        const themeToggle = document.getElementById('themeToggle');

        const readTitle = document.getElementById('readTitle');
        const readBody = document.getElementById('readBody');
        const readId = document.getElementById('readId');

        // 1. FETCH ARTICLES FROM API
        async function fetchArticles() {
            try {
                // Using JSONPlaceholder API to get fake posts as articles
                const response = await fetch('https://jsonplaceholder.typicode.com/posts?_limit=8');
                const articles = await response.json();
                
                // Hide loader and display container
                loading.classList.add('hidden');
                articleContainer.classList.remove('hidden');

                // Render each article as a card
                articles.forEach(article => {
                    const card = document.createElement('div');
                    card.className = "bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:shadow-md hover:border-indigo-200 transition cursor-pointer flex flex-col justify-between";
                    
                    card.innerHTML = `
                        <div>
                            <span class="text-xs font-bold text-indigo-600 uppercase tracking-wide">Story #${article.id}</span>
                            <h3 class="text-lg font-bold text-slate-900 mt-2 line-clamp-2">${article.title}</h3>
                            <p class="text-slate-500 text-sm mt-2 line-clamp-3">${article.body}</p>
                        </div>
                        <span class="text-sm font-semibold text-indigo-600 mt-4 inline-block">Read article &rarr;</span>
                    `;

                    // Click event to switch to reader view for this specific article
                    card.addEventListener('click', () => {
                        showReaderView(article);
                    });

                    articleContainer.appendChild(card);
                });

            } catch (error) {
                loading.innerHTML = '<p class="text-red-500 font-medium">Failed to load articles. Please check your internet connection.</p>';
            }
        }

        // 2. SWITCH TO SINGLE ARTICLE VIEW
        function showReaderView(article) {
            readTitle.textContent = article.title;
            readBody.textContent = article.body;
            readId.textContent = article.id;

            listView.classList.add('hidden');
            readerView.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 3. SWITCH BACK TO LIST VIEW
        backBtn.addEventListener('click', () => {
            readerView.classList.add('hidden');
            listView.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // 4. DARK MODE TOGGLE (Bonus feature)
        let isDarkMode = false;
        themeToggle.addEventListener('click', () => {
            isDarkMode = !isDarkMode;
            if (isDarkMode) {
                document.body.className = "bg-slate-900 text-slate-100 font-sans antialiased min-h-screen flex flex-col";
                document.querySelector('header').className = "bg-slate-800 border-b border-slate-700 sticky top-0 z-10 shadow-sm";
                document.querySelector('footer').className = "bg-slate-800 border-t border-slate-700 py-6 text-center text-sm text-slate-500";
                themeToggle.textContent = "☀️ Light Mode";
                themeToggle.className = "text-sm bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-full transition font-medium";
            } else {
                document.body.className = "bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col";
                document.querySelector('header').className = "bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm";
                document.querySelector('footer').className = "bg-white border-t border-slate-200 py-6 text-center text-sm text-slate-400";
                themeToggle.textContent = "🌙 Dark Mode";
                themeToggle.className = "text-sm bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-full transition font-medium";
            }
        });

        // Initialize App on Load
        fetchArticles();
    </script>
</body>
</html>
