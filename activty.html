<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#00d632" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cash Mode" />
    <link rel="manifest" href="/site.webmanifest?v=4" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <title>Activity - Cash App</title>
    <link rel="prefetch" href="pay.html" as="document" />
    <link rel="prefetch" href="home.html" as="document" />
    <link rel="prefetch" href="card.html" as="document" />
    <link rel="preload" href="font/CashSans.ttf" as="font" type="font/ttf" crossorigin />
    <script type="speculationrules">
      {
        "prerender": [
          {
            "source": "list",
            "urls": ["pay.html", "home.html", "card.html"]
          }
        ]
      }
    </script>
    <script>
      (() => {
        const DARK_MODE_KEY = "cashAppDarkMode";
        try {
          const prefersDark = localStorage.getItem(DARK_MODE_KEY) === "true";
          if (prefersDark) {
            document.documentElement.setAttribute("data-theme", "dark");
            document.documentElement.classList.add("dark-boot");
            document.documentElement.style.backgroundColor = "#000";
          }
        } catch (err) {
          /* silent */
        }
      })();
    </script>
    <style id="theme-boot-inline">
      /* Prevent initial white flash before CSS loads */
      html.dark-boot,
      html.dark-boot body {
        background: #000000 !important;
        color: #ffffff !important;
      }
      html.dark-boot {
        --app-bg-color: #000000;
        --app-bg-secondary: #121212;
        --card-bg-color: #000000;
        --text-primary: #ffffff;
        --text-secondary: #8e8e93;
        --border-color-light: #1c1c1e;
        --button-green: #00d632;
      }
    </style>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="guard.js"></script>
    <script src="dark-mode.js"></script>
    <style>
      @font-face {
        font-family: "CashMarket";
        font-style: normal;
        src: url("font/CashSans.ttf") format("truetype");
        font-display: swap;
      }
      :root {
        --header-height: 60px;
        --padding-screen: 20px;
        /* Cash App Light Mode Colors matching screenshot */
        --app-bg-color: #ffffff;
        --app-bg-secondary: #f6f6f6;
        --card-bg-color: #ffffff;
        --text-primary: #1a1a1a;
        --text-secondary: #8a8a8e;
        --border-color-light: #f0f0f2;
        --accent-green: #00d632;
        --button-green: #00d632;
        --accent-red: #ff3b30;
        --search-bg: #f2f2f4;
        --search-text: #000000;
        --profile-bg: #ffffff;
        --details-bg: #ffffff;
        --details-text: #000000;
        --modal-bg: #ffffff;
        --modal-cancel-bg: #e5e5ea;
        --nav-inactive: #999999;
        --font-family: "CashMarket", -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI",
          sans-serif;
      }
      html[data-theme="dark"],
      body.dark-mode {
        --app-bg-color: #000000;
        --app-bg-secondary: #121212;
        --card-bg-color: #000000;
        --text-primary: #ffffff;
        --text-secondary: #8e8e93;
        --border-color-light: #1c1c1e;
        --button-green: #00d632;
        --search-bg: #1c1c1e;
        --search-text: #ffffff;
        --profile-bg: #1c1c1e;
        --details-bg: #000000;
        --details-text: #ffffff;
        --modal-bg: #1c1c1e;
        --modal-cancel-bg: #2c2c2e;
        --nav-inactive: #636366;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
        width: 100%;
        overscroll-behavior: none;
      }
      body {
        font-family: var(--font-family);
        background-color: var(--app-bg-color);
        color: var(--text-primary);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      a {
        text-decoration: none;
        color: inherit;
      }
      .activity-container {
        max-width: 450px;
        width: 100%;
        height: 100%;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        position: relative;
        background-color: var(--app-bg-color);
      }
      .activity-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px var(--padding-screen) 10px;
        height: var(--header-height);
        flex-shrink: 0;
      }
      .activity-header h1 {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.5px;
        color: var(--text-primary);
      }
      .profile-icon-link {
        display: block;
        position: relative;
        width: 36px;
        height: 36px;
      }
      .profile-icon {
        font-size: 22px;
        color: var(--text-primary);
        width: 100%;
        height: 100%;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        object-fit: cover;
      }
      .profile-badge {
        position: absolute;
        top: -1px;
        right: -2px;
        background-color: var(--accent-red);
        color: #ffffff;
        font-size: 11px;
        font-weight: 700;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid var(--app-bg-color);
      }
      .search-bar-container {
        padding: 4px var(--padding-screen) 14px;
        flex-shrink: 0;
      }
      .search-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        background-color: var(--search-bg);
        border-radius: 20px;
        padding: 10px 16px;
      }
      .search-bar i {
        color: var(--text-secondary);
        font-size: 15px;
      }
      .search-bar input {
        flex-grow: 1;
        border: none;
        background: none;
        outline: none;
        font-size: 16px;
        font-weight: 500;
        color: var(--search-text);
        font-family: inherit;
      }
      .search-bar input::placeholder {
        color: #a0a0a5;
      }
      .quick-actions {
        display: flex;
        gap: 16px;
        padding: 4px var(--padding-screen) 18px;
        flex-shrink: 0;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .quick-actions::-webkit-scrollbar {
        display: none;
      }
      .quick-action {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        flex-shrink: 0;
        width: 64px;
      }
      .quick-action-icon {
        width: 58px;
        height: 58px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 22px;
        background-repeat: no-repeat;
        transition: transform 0.15s ease;
      }
      .quick-action-icon:active {
        transform: scale(0.95);
      }
      .quick-action-icon.green {
        background-color: var(--button-green);
        color: white;
      }
      .quick-action-icon.avatar {
        background-size: cover;
        background-position: center;
        background-color: var(--profile-bg);
        color: #ffffff;
        font-size: 22px;
        font-weight: 700;
      }
      .quick-action-label {
        font-size: 13px;
        font-weight: 600;
        color: #4a4a4a;
        letter-spacing: -0.2px;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        width: 100%;
      }
      html[data-theme="dark"] .quick-action-label {
        color: var(--text-secondary);
      }
      .activity-list-container {
        flex-grow: 1;
        overflow-y: auto;
        padding-bottom: 70px;
        -webkit-overflow-scrolling: touch;
      }
      .date-group-header {
        padding: 16px var(--padding-screen) 10px;
        font-size: 13px;
        font-weight: 700;
        color: var(--text-secondary);
        background-color: var(--app-bg-secondary);
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      .transaction-list {
        list-style: none;
        background-color: var(--card-bg-color);
      }
      .transaction-item {
        display: flex;
        align-items: center;
        padding: 16px var(--padding-screen);
        border-bottom: 1px solid var(--border-color-light);
        cursor: pointer;
        transition: background-color 0.15s ease, transform 0.3s ease, opacity 0.3s ease;
      }
      .transaction-item:active {
        background-color: var(--app-bg-secondary);
      }
      .transaction-item:last-child {
        border-bottom: none;
      }
      .transaction-item.deleting {
        transform: translateX(-100%);
        opacity: 0;
      }
      .transaction-item.hide {
        display: none;
      }
      .transaction-avatar {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        margin-right: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: 700;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        color: white;
        flex-shrink: 0;
        overflow: hidden;
      }
      .transaction-icon {
        background-color: var(--button-green);
      }
      .transaction-details {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding-right: 8px;
      }
      .transaction-name-row {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .transaction-name {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.3px;
        color: var(--text-primary);
      }
      .business-icon {
        color: var(--accent-green);
        font-size: 12px;
      }
      .transaction-info {
        font-size: 15px;
        font-weight: 500;
        color: var(--text-secondary);
        margin-top: 2px;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .transaction-amount-wrapper {
        display: flex;
        align-items: center;
        justify-content: flex-end;
      }
      .transaction-amount {
        font-size: 17px;
        font-weight: 700;
        text-align: right;
        letter-spacing: -0.3px;
        color: var(--text-primary);
        font-family: var(--font-family);
      }
      .transaction-amount.positive {
        color: var(--accent-green);
      }
      .transaction-pill-badge {
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1.5px solid #e0e0e5;
        border-radius: 20px;
        padding: 6px 14px;
        font-size: 16px;
        font-weight: 700;
        color: var(--text-primary);
      }
      .transaction-pill-badge i {
        color: var(--accent-green);
        font-size: 14px;
      }
      .empty-state {
        text-align: center;
        padding: 12vh var(--padding-screen);
      }
      .empty-state h2 {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.4px;
      }
      .empty-state p {
        font-size: 15px;
        color: var(--text-secondary);
        margin-top: 8px;
        margin-bottom: 30px;
      }

      /* Native detailed overlay styled matching exact Cash App visual spec */
      .details-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: var(--details-bg);
        color: var(--details-text);
        z-index: 4000;
        transform: translateY(100%);
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        display: flex;
        flex-direction: column;
      }
      .details-overlay.show {
        transform: translateY(0);
      }
      .details-header {
        display: flex;
        align-items: center;
        padding: 16px var(--padding-screen);
        height: var(--header-height);
      }
      .details-close-btn {
        font-size: 20px;
        background: none;
        border: none;
        cursor: pointer;
        color: var(--details-text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
        border-radius: 50%;
        transition: background-color 0.2s;
      }
      .details-close-btn:active {
        background-color: var(--app-bg-secondary);
      }
      .details-content {
        flex-grow: 1;
        overflow-y: auto;
        padding: 12px var(--padding-screen) 40px;
        -webkit-overflow-scrolling: touch;
      }
      .details-hero {
        text-align: left;
        padding-bottom: 12px;
      }
      .details-hero .transaction-avatar {
        width: 64px;
        height: 64px;
        margin: 0 0 18px 0;
        border-radius: 50%;
        font-size: 24px;
      }
      .details-hero .transaction-name {
        font-size: 32px;
        font-weight: 800;
        line-height: 1.15;
        margin-bottom: 6px;
        letter-spacing: -0.8px;
      }
      .details-hero .transaction-info {
        color: var(--text-secondary);
        font-size: 15px;
        line-height: 1.4;
        font-weight: 500;
      }
      .details-amount {
        font-size: 48px;
        font-weight: 800;
        margin: 24px 0 16px 0;
        letter-spacing: -1px;
        font-family: var(--font-family);
      }
      .details-list {
        list-style: none;
        margin-top: 12px;
        padding: 0;
        border-top: 1px solid var(--border-color-light);
      }
      .details-list::before {
        content: "Transaction details";
        display: block;
        font-size: 18px;
        font-weight: 800;
        padding: 24px 0 16px;
        color: var(--details-text);
        letter-spacing: -0.4px;
      }
      .details-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 0;
      }
      .details-item-left {
        display: flex;
        align-items: flex-start;
        gap: 18px;
      }
      .details-icon {
        font-size: 18px;
        width: 22px;
        margin-top: 2px;
        text-align: center;
        color: var(--details-text);
      }
      .details-label {
        font-size: 15px;
        font-weight: 700;
        color: var(--details-text);
        display: block;
        letter-spacing: -0.2px;
      }
      .details-value {
        color: var(--text-secondary);
        font-size: 14px;
        font-weight: 500;
        text-align: left;
        margin-top: 3px;
        line-height: 1.4;
      }
      .details-right-icon {
        color: var(--text-secondary);
        font-size: 18px;
        cursor: pointer;
      }
      .bottom-nav {
        display: flex;
        justify-content: space-around;
        align-items: center;
        border-top: 1px solid var(--border-color-light);
        background-color: var(--card-bg-color);
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 65px;
        padding: 0 var(--padding-screen);
        z-index: 200;
      }
      .nav-button {
        background: none;
        border: none;
        cursor: pointer;
        padding: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: inherit;
        font-weight: 700;
        color: var(--nav-inactive);
        min-width: 44px;
        transition: opacity 0.15s ease;
      }
      .nav-button:active {
        opacity: 0.7;
      }
      .nav-button svg {
        fill: var(--nav-inactive);
      }
      .nav-button.disabled,
      .nav-button:disabled {
        cursor: default;
        opacity: 0.45;
        pointer-events: none;
      }
      .nav-button.disabled svg,
      .nav-button:disabled svg {
        fill: rgba(140, 140, 140, 0.5);
      }
      .nav-button.active,
      .nav-button.active svg {
        color: var(--text-primary);
        fill: var(--text-primary);
      }
      #nav-balance-display {
        font-size: 18px;
        font-weight: 800;
        color: var(--text-secondary);
      }
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        display: none;
        justify-content: center;
        align-items: flex-end;
        z-index: 5000;
        opacity: 0;
        transition: opacity 0.25s ease;
      }
      .modal-overlay.show {
        display: flex;
        opacity: 1;
      }
      .modal-content {
        background-color: var(--modal-bg);
        width: 100%;
        max-width: 450px;
        border-top-left-radius: 24px;
        border-top-right-radius: 24px;
        padding: 24px 20px 36px;
        transform: translateY(100%);
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .modal-overlay.show .modal-content {
        transform: translateY(0);
      }
      .delete-modal-content {
        text-align: center;
      }
      .delete-modal-content p {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 24px;
        color: var(--text-primary);
        letter-spacing: -0.3px;
      }
      .delete-modal-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .delete-modal-btn {
        padding: 16px;
        border-radius: 30px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        border: none;
        font-family: inherit;
        transition: opacity 0.15s ease;
      }
      .delete-modal-btn:active {
        opacity: 0.8;
      }
      .delete-modal-btn.confirm {
        background-color: var(--accent-red);
        color: white;
      }
      .delete-modal-btn.cancel {
        background-color: var(--modal-cancel-bg);
        color: var(--text-primary);
      }
    </style>
  </head>
  <body>
    <div class="activity-container">
      <header class="activity-header">
        <h1>Activity</h1>
        <a href="profile.html" class="profile-icon-link" id="profile-link">
          <i class="fa-regular fa-user profile-icon"></i>
          <span class="profile-badge">1</span>
        </a>
      </header>
      <div class="search-bar-container">
        <div class="search-bar">
          <i class="fa-solid fa-magnifying-glass"></i
          ><input
            type="text"
            id="search-input"
            placeholder="Search transactions"
          />
        </div>
      </div>
      <div class="quick-actions" id="quick-actions-container"></div>

        <button class="nav-button disabled" aria-label="Search" type="button" aria-disabled="true">

        <a href="#"

            <svg width="22" height="22" viewBox="0 0 24 25">

                transform="translate(-349 -16)"
                fill-rule="evenodd"

                d="M370 28C370 32.9706 365.971 37 361 37C356.029 37 352 32.9706 352 28C352 23.0294 356.029 19 361 19C365.971 19 370 23.0294 370 28ZM373 28C373 34.6274 367.627 40 361 40C354.373 40 349 34.6274 349 28C349 21.3726 354.373 16 361 16C367.627 16 373 21.3726 373 28ZM362.5 24C362.5 23.1716 361.828 22.5 361 22.5C360.172 22.5 359.5 23.1716 359.5 24V27.4893C359.5 28.4591 360.061 29.3414 360.939 29.753L364.363 31.3582C365.113 31.7098 366.007 31.3868 366.358 30.6367C366.71 29.8865 366.387 28.9934 365.637 28.6418L362.5 27.1715V24Z"

    </div>

    <div class="details-overlay" id="details-overlay"></div>
    <div class="modal-overlay" id="delete-modal-overlay">
      <div class="modal-content delete-modal-content">
        <p>Are you sure you want to delete this transaction?</p>
        <div class="delete-modal-actions">
          <button class="delete-modal-btn cancel" id="delete-cancel-btn">
            No
          </button>
          <button class="delete-modal-btn confirm" id="delete-confirm-btn">
            Yes
          </button>
        </div>
      </div>
    </div>

    <script>
      const profileIconLink = document.querySelector(".profile-icon-link");
      const quickActionsContainer = document.getElementById(
        "quick-actions-container"
      );
      const activityListContainer = document.getElementById(
        "activity-list-container"
      );
      const detailsOverlay = document.getElementById("details-overlay");
      const searchInput = document.getElementById("search-input");
      const deleteModalOverlay = document.getElementById(
        "delete-modal-overlay"
      );
      const deleteConfirmBtn = document.getElementById("delete-confirm-btn");
      const deleteCancelBtn = document.getElementById("delete-cancel-btn");

      const userProfileKey = "cashAppUserProfile",
        contactStorageKey = "cashAppContacts",
        transactionsKey = "cashAppTransactions";
      const defaultProfile = { fullName: "Jane Doe", profilePic: "" };
      const defaultContacts = [
        {
          id: 999,
          name: "Jay-Z",
          cashtag: "$jayz",
          avatar: "",
          color: "#000000"
        },
        {
          id: 1,
          name: "Business",
          cashtag: "$biz",
          avatar: "",
          color: "#b052ff",
          isBusiness: true
        },
        {
          id: 2,
          name: "Christina",
          cashtag: "$christina",
          avatar: "",
          color: "#ff5252"
        },
        {
          id: 3,
          name: "Destiny",
          cashtag: "$destiny",
          avatar: "",
          color: "#30d158"
        },
        {
          id: 4,
          name: "Pulsz",
          cashtag: "$pulsz",
          avatar: "",
          color: "#2f80ed"
        }
      ];
      
      const hasDirectAvatar = (entity = {}) => {
        const platform = (entity.platform || "").toLowerCase();
        if (platform === "tiktok" || platform === "cashapp") return true;
        const handle = (entity.cashtag || "").trim();
        if (handle.startsWith("@")) return true;
        const avatar = (entity.avatar || "").toLowerCase();
        if (avatar.includes("/api/cashapp/avatar") || 
            avatar.includes("/api/tiktok/avatar") ||
            avatar.includes("franklin-assets") ||
            avatar.includes("squarecdn.com") ||
            avatar.includes(".jpeg") ||
            avatar.includes(".jpg") ||
            avatar.includes(".png") ||
            avatar.includes(".webp")) {
          if (avatar.includes("share-image")) return false;
          return true;
        }
        return false;
      };

      let longPressTimer;
      let transactionToDelete = null;

      /* Standardized to force 2 decimal places, e.g., 55 -> $55.00 */
      const formatCurrency = (amount, sign = true) =>
        `${sign ? (amount < 0 ? "− " : "+") : ""}$${Math.abs(
          Number(amount) || 0
        ).toLocaleString("en-US", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        })}`;

      const formatSimpleCurrency = (amount) =>
        `$${Math.abs(Number(amount) || 0).toLocaleString("en-US", { 
          minimumFractionDigits: 2, 
          maximumFractionDigits: 2 
        })}`;

      const escapeHtml = (value = "") =>
        String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");

      const escapeAttr = (value = "") =>
        escapeHtml(value).replace(/"/g, "&quot;").replace(/'/g, "&#39;");

      const getInitial = (value = "") => {
        const trimmed = String(value).trim();
        return trimmed ? trimmed.charAt(0).toUpperCase() : "?";
      };

      // Converts transaction dates to Cash App header format (TODAY, YESTERDAY, AUGUST 23)
      function getStatusGroup(t) {
        if (t.status === "pending" || t.status === "refund_requested") {
          return "PENDING";
        }
        
        const txDate = new Date(t.date);
        const today = new Date();
        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);

        if (txDate.toDateString() === today.toDateString()) {
          return "TODAY";
        } else if (txDate.toDateString() === yesterday.toDateString()) {
          return "YESTERDAY";
        } else {
          // Format as Month + Day (e.g., AUGUST 23)
          return txDate.toLocaleDateString("en-US", {
            month: "long",
            day: "numeric"
          }).toUpperCase();
        }
      }

      function renderActivity(query = "") {
        const transactions = (
          JSON.parse(localStorage.getItem(transactionsKey)) || []
        ).sort((a, b) => new Date(b.date) - new Date(a.date));

        let contacts =
          JSON.parse(localStorage.getItem(contactStorageKey)) ||
          defaultContacts;

        // Ensure Jay-Z exists in contacts list
        let jayZContact = contacts.find((c) => 
          (c.name && c.name.toLowerCase().includes("jay")) || 
          (c.cashtag && c.cashtag.toLowerCase().includes("jay"))
        );

        if (!jayZContact) {
          jayZContact = { id: 999, name: "Jay-Z", cashtag: "$jayz", avatar: "", color: "#000000" };
        }

        // Put Jay-Z right next to "Get $20", then the rest of the recent payment accounts
        const otherContacts = contacts.filter((c) => c.id !== jayZContact.id);
        const quickActionContacts = [jayZContact, ...otherContacts];

        let quickActionsHtml = `
          <div class="quick-action">
            <div class="quick-action-icon green"><i class="fa-solid fa-plus"></i></div>
            <span class="quick-action-label">Get $20</span>
          </div>`;

        quickActionContacts.forEach((contact) => {
          const contactNameRaw = contact.name || contact.cashtag || "Contact";
          const contactLabel = escapeHtml(contactNameRaw.split(" ")[0]);
          const contactInitial = getInitial(contactNameRaw);
          const contactHasAvatar = Boolean(contact.avatar);
          const contactHasDirectAvatar =
            contactHasAvatar && hasDirectAvatar(contact);
          const avatarStyle = contactHasAvatar
            ? `style="background-image:url('${escapeAttr(
                contact.avatar
              )}');${
                contactHasDirectAvatar
                  ? "background-position:center;background-size:cover;background-color:var(--profile-bg);"
                  : "background-position:center 22%;background-size:700%;"
              }"`
            : `style="background-color:${escapeAttr(
                contact.color || "#b052ff"
              )};"`;
          const avatarContent = contactHasAvatar ? "" : contactInitial;

          quickActionsHtml += `
            <div class="quick-action">
              <div class="quick-action-icon avatar" ${avatarStyle}>${avatarContent}</div>
              <span class="quick-action-label">${contactLabel}</span>
            </div>`;
        });

        quickActionsContainer.innerHTML = quickActionsHtml;

        const filteredTransactions = transactions.filter((t) => {
          const searchTerm = query.toLowerCase();
          if (!searchTerm) return true;
          if (t.amount.toString().includes(searchTerm)) return true;
          if (t.type.includes(searchTerm)) return true;

          if (t.type === "payment") {
            const recipientName = t.recipient
              ? t.recipient.name
              : (contacts.find((c) => c.id == t.contactId) || {}).name;
            return (
              recipientName && recipientName.toLowerCase().includes(searchTerm)
            );
          }
          return false;
        });

        if (filteredTransactions.length === 0) {
          activityListContainer.innerHTML = `<div class="empty-state"><h2>${
            query ? "No results found" : "Nothing Here!"
          }</h2><p>${
            query
              ? "Try a different search term."
              : "Your future activity will be organized here"
          }</p></div>`;
          return;
        }

        const groupedTransactions = filteredTransactions.reduce((groups, t) => {
          const groupName = getStatusGroup(t);
          if (!groups[groupName]) groups[groupName] = [];
          groups[groupName].push(t);
          return groups;
        }, {});

        let html = "";
        
        // Dynamically iterate over groups while preserving PENDING at top
        const keys = Object.keys(groupedTransactions);
        const groupOrder = keys.sort((a, b) => {
          if (a === "PENDING") return -1;
          if (b === "PENDING") return 1;
          if (a === "TODAY") return -1;
          if (b === "TODAY") return 1;
          if (a === "YESTERDAY") return -1;
          if (b === "YESTERDAY") return 1;
          return 0;
        });
        
        groupOrder.forEach((dateGroup) => {
          if (!groupedTransactions[dateGroup]) return;
          
          html += `<div class="date-group-header">${dateGroup}</div><ul class="transaction-list">`;
          groupedTransactions[dateGroup].forEach((t) => {
            let avatar,
              name,
              info,
              amountHtml,
              isBusiness = false;
            const time = new Date(t.date).toLocaleTimeString("en-US", {
              hour: "numeric",
              minute: "2-digit",
              hour12: true,
            });
            
            switch (t.type) {
              case "payment":
                let recipient;
                if (t.recipient) {
                  recipient = t.recipient;
                } else {
                  recipient = contacts.find((c) => c.id == t.contactId);
                }

                if (!recipient) break;

                const recipientNameRaw =
                  recipient.name || recipient.cashtag || "Contact";
                const recipientName = escapeHtml(recipientNameRaw);
                const recipientInitial = getInitial(recipientNameRaw);
                const recipientHasAvatar = Boolean(recipient.avatar);
                const recipientHasDirectAvatar =
                  recipientHasAvatar && hasDirectAvatar(recipient);
                isBusiness = Boolean(recipient.isBusiness);

                if (recipientHasAvatar) {
                  avatar = `<div class="transaction-avatar${
                    recipientHasDirectAvatar ? " avatar-tiktok" : ""
                  }" style="background-image:url('${escapeAttr(
                    recipient.avatar
                  )}');${
                    recipientHasDirectAvatar
                      ? "background-position:center;background-size:cover;background-color:var(--profile-bg);"
                      : "background-position:center 21%;background-size:655%;"
                  }"></div>`;
                } else {
                  avatar = `<div class="transaction-avatar" style="background-color:${escapeAttr(
                    recipient.color || "#00d632"
                  )};">${recipientInitial}</div>`;
                }
                name = recipientName;
                
                if (t.status === "refund_requested") {
                  info = `<i class="fa-solid fa-reply" style="font-size: 11px;"></i> Refund Requested`;
                } else if (t.status === "pending") {
                  info = `Pending • ${time}`;
                } else {
                  info = `At ${time}`;
                }

                if (t.badgeAmount) {
                  amountHtml = `<div class="transaction-pill-badge"><i class="fa-regular fa-heart"></i> $${Number(t.badgeAmount).toFixed(2)}</div>`;
                } else {
                  amountHtml = `<div class="transaction-amount">${formatSimpleCurrency(t.amount)}</div>`;
                }
                break;
              case "add":
                avatar = `<div class="transaction-avatar transaction-icon"><i class="fa-solid fa-plus"></i></div>`;
                name = "Add money";
                info = `Bank Account • ${time}`;
                amountHtml = `<div class="transaction-amount positive">${formatCurrency(t.amount)}</div>`;
                break;
              case "withdraw":
                avatar = `<div class="transaction-avatar transaction-icon" style="background-color: #00d632;"><i class="fa-solid fa-dollar-sign"></i></div>`;
                name = "Cash Out";
                info = t.bankName || "Coastal Community Bank";
                amountHtml = `<div class="transaction-amount">$${Math.abs(Number(t.amount) || 0).toFixed(2)}</div>`;
                break;
            }

            const businessBadge = isBusiness ? `<i class="fa-solid fa-building business-icon"></i>` : "";

            html += `
              <li class="transaction-item" data-id="${t.id}" data-type="${t.type}">
                ${avatar}
                <div class="transaction-details">
                  <div class="transaction-name-row">
                    <span class="transaction-name">${name}</span>
                    ${businessBadge}
                  </div>
                  <span class="transaction-info">${info}</span>
                </div>
                <div class="transaction-amount-wrapper">
                  ${amountHtml}
                </div>
              </li>`;
          });
          html += "</ul>";
        });
        activityListContainer.innerHTML = html;
      }

      function renderTransactionDetails(transactionId) {
        const transactions =
          JSON.parse(localStorage.getItem(transactionsKey)) || [];
        const transaction = transactions.find((t) => t.id == transactionId);
        if (!transaction || transaction.type !== "payment") return;

        const contacts =
          JSON.parse(localStorage.getItem(contactStorageKey)) ||
          defaultContacts;
        const userProfile =
          JSON.parse(localStorage.getItem(userProfileKey)) || defaultProfile;

        let recipient;
        if (transaction.recipient) {
          recipient = transaction.recipient;
        } else {
          recipient = contacts.find((c) => c.id == transaction.contactId);
        }
        if (!recipient) return;

        const time = new Date(transaction.date).toLocaleTimeString("en-US", {
          hour: "numeric",
          minute: "2-digit",
          hour12: true,
        });
        const recipientNameRaw =
          recipient.name || recipient.cashtag || "Contact";
        const recipientName = escapeHtml(recipientNameRaw);
        const recipientInitial = getInitial(recipientNameRaw);
        const statusText =
          transaction.status === "success" || !transaction.status
            ? "Complete"
            : transaction.status.charAt(0).toUpperCase() + transaction.status.slice(1);
        const statusDetail =
          transaction.status === "success" || !transaction.status
            ? "Payment sent successfully"
            : transaction.status === "pending"
            ? "Payment on hold"
            : "Received";
        const recipientHasAvatar = Boolean(recipient.avatar);
        const recipientHasDirectAvatar =
          recipientHasAvatar && hasDirectAvatar(recipient);
        const avatar = recipientHasAvatar
          ? `<div class="transaction-avatar${
              recipientHasDirectAvatar ? " avatar-tiktok" : ""
            }" style="background-image:url('${escapeAttr(
              recipient.avatar
            )}');${
              recipientHasDirectAvatar
                ? "background-position:center;background-size:cover;background-color:var(--profile-bg);"
                : "background-position:center 21%;background-size:655%;"
            }"></div>`
          : `<div class="transaction-avatar" style="background-color:${escapeAttr(
              recipient.color || "#00d632"
            )};">${recipientInitial}</div>`;
        const senderName = escapeHtml(userProfile.fullName || "Jane Doe");

        detailsOverlay.innerHTML = `
          <header class="details-header">
            <button class="details-close-btn" id="details-close-btn">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </header>
          <main class="details-content">
            <div class="details-hero">
              ${avatar}
              <h1 class="transaction-name">${recipientName}</h1>
              <p class="transaction-info">At ${time}</p>
              <h2 class="details-amount">${formatCurrency(transaction.amount, false)}</h2>
            </div>
            <ul class="details-list">
              <li class="details-item">
                <div class="details-item-left">
                  <i class="details-icon fa-solid fa-check"></i>
                  <div>
                    <span class="details-label">${statusText}</span>
                    <span class="details-value">${statusDetail}</span>
                  </div>
                </div>
              </li>
              <li class="details-item">
                <div class="details-item-left">
                  <i class="details-icon fa-regular fa-user"></i>
                  <div>
                    <span class="details-label">Payment between</span>
                    <span class="details-value">To: ${recipientName}<br>From: ${senderName}</span>
                  </div>
                </div>
              </li>
              <li class="details-item">
                <div class="details-item-left">
                  <i class="details-icon fa-solid fa-dollar-sign"></i>
                  <div>
                    <span class="details-label">Payment source</span>
                    <span class="details-value">COASTAL COMMUNITY BANK</span>
                  </div>
                </div>
              </li>
              <li class="details-item">
                <div class="details-item-left">
                  <i class="details-icon fa-solid fa-bars-staggered"></i>
                  <div>
                    <span class="details-label">Fees</span>
                    <span class="details-value">None applied</span>
                  </div>
                </div>
                <i class="fa-solid fa-circle-info details-right-icon"></i>
              </li>
              <li class="details-item">
                <div class="details-item-left">
                  <i class="details-icon fa-solid fa-hashtag"></i>
                  <div>
                    <span class="details-label">Transaction number</span>
                  </div>
                </div>
                <i class="fa-regular fa-copy details-right-icon"></i>
              </li>
            </ul>
          </main>`;

        detailsOverlay.classList.add("show");
        document
          .getElementById("details-close-btn")
          .addEventListener("click", () =>
            detailsOverlay.classList.remove("show")
          );
      }

      function showDeleteModal(id) {
        transactionToDelete = id;
        deleteModalOverlay.classList.add("show");
      }
      function hideDeleteModal() {
        deleteModalOverlay.classList.remove("show");
        transactionToDelete = null;
      }
      function deleteTransaction() {
        if (!transactionToDelete) return;
        let transactions =
          JSON.parse(localStorage.getItem(transactionsKey)) || [];
        transactions = transactions.filter((t) => t.id != transactionToDelete);
        localStorage.setItem(transactionsKey, JSON.stringify(transactions));
        const itemEl = document.querySelector(
          `.transaction-item[data-id="${transactionToDelete}"]`
        );
        if (itemEl) {
          itemEl.classList.add("deleting");
          itemEl.addEventListener("transitionend", () =>
            renderActivity(searchInput.value)
          );
        } else {
          renderActivity(searchInput.value);
        }
        hideDeleteModal();
      }

      document.addEventListener("DOMContentLoaded", () => {
        const userProfile =
          JSON.parse(localStorage.getItem(userProfileKey)) || defaultProfile;
        
        if (userProfile.profilePic) {
          profileIconLink.innerHTML = `<img src="${userProfile.profilePic}" alt="Profile" class="profile-icon"><span class="profile-badge">1</span>`;
        }
        
        renderActivity();

        window.__refreshActivity = function () {
          renderActivity(searchInput ? searchInput.value : "");
          if (activityListContainer) activityListContainer.scrollTop = 0;
        };

        searchInput.addEventListener("input", () =>
          renderActivity(searchInput.value)
        );

        activityListContainer.addEventListener("pointerdown", (e) => {
          const item = e.target.closest(".transaction-item");
          if (!item) return;
          e.preventDefault();
          longPressTimer = setTimeout(() => {
            showDeleteModal(item.dataset.id);
          }, 500);
        });

        const clearLongPress = () => clearTimeout(longPressTimer);
        activityListContainer.addEventListener("pointerup", clearLongPress);
        activityListContainer.addEventListener("pointerleave", clearLongPress);
        activityListContainer.addEventListener("pointermove", clearLongPress);

        activityListContainer.addEventListener("click", (e) => {
          clearTimeout(longPressTimer);
          const item = e.target.closest(".transaction-item");
          if (item && item.dataset.id && item.dataset.type === "payment") {
            renderTransactionDetails(item.dataset.id);
          }
        });

        deleteConfirmBtn.addEventListener("click", deleteTransaction);
        deleteCancelBtn.addEventListener("click", hideDeleteModal);
      });
    </script>
    <script src="footer.display.js"></script>
    <script>
      (function () {
        const warmed = new Set();
        function warm(url) {
          if (warmed.has(url)) return;
          warmed.add(url);
          const link = document.createElement("link");
          link.rel = "prefetch";
          link.href = url;
          link.as = "document";
          document.head.appendChild(link);
        }
        document.addEventListener(
          "pointerdown",
          (e) => {
            const a = e.target.closest("a[href]");
            if (!a) return;
            const href = a.getAttribute("href");
            if (!href || href === "#" || href.startsWith("http") || href.startsWith("mailto:")) return;
            warm(href);
          },
          { passive: true }
        );
      })();
    </script>
